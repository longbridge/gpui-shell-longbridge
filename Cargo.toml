[package]
name = "gpui-shell-longbridge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The local checkout, while the dock fix in it is unpublished: a dock's own box
# moved out of `DockSkin` and into `DockArea::render_dock`, so a script-drawn
# dock is a column again. Back to the git branch once that lands.
gpui-shell = { path = "../gpui-component/crates/shell" }
# Direct for one line. `set_theme` carries the semantic tokens only, so the
# color base draws a dock's split handle from is out of the script's reach and
# the host has to project it -- see the `resizable.handle` write in `main`.
gpui-base = { path = "../gpui-component/crates/base" }
gpui = { git = "https://github.com/zed-industries/zed", features = ["profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui-shell = { opt-level = 3 }
rquickjs = { opt-level = 3 }
