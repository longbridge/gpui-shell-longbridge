[package]
name = "gpui-shell-longbridge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-shell = { git = "https://github.com/longbridge/gpui-component.git", branch = "shell-keyboard-pointer-actions-window" }
gpui = { git = "https://github.com/zed-industries/zed", features = ["profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui-shell = { opt-level = 3 }
rquickjs = { opt-level = 3 }
